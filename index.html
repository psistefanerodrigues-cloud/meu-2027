<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ritual de fim de ano: papel creme, vinho como cor da marca, estrelinha ✱ como único ornamento. Coluna única, uma pergunta por tela. */
  --wine:#6E1F30;
  --wine-deep:#4A1420;
  --paper:#FBF6F0;
  --card:#FFFDF9;
  --ink:#2B1B1F;
  --muted:#7A666A;
  --sand:#D3C3B9;
  --blush:#F1DDD5;
  --line:#E7DAD1;
  --gold:#B4874B;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:680px;margin:0 auto;padding:12px 16px 10px;display:grid;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted)}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--wine);letter-spacing:.01em}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stage{display:grid;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stage i{display:block;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.stage i span{display:block;height:100%;background:var(--wine);width:0;transition:width .35s ease}
.stage.on{color:var(--wine);font-weight:600}
@media (max-width:480px){.stage em{display:none}}
main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:28px 16px 120px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);font-weight:600;display:flex;gap:8px;align-items:center}
.kicker::before{content:"✱";font-size:14px;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:.25em 0 .35em;color:var(--ink)}
h1{font-size:clamp(44px,9vw,72px)}
h2{font-size:clamp(34px,6.5vw,48px)}
h1 em,h2 em{color:var(--wine)}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 14px;max-width:62ch}
.lead{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.hero{background:var(--wine);color:#FBEFEA;border-radius:22px;padding:34px 24px;position:relative;overflow:hidden}
.hero h1{color:#FFF7F3}
.hero h1 em{color:#F3C9BD}
.hero p{color:#F6E2DC}
.hero .stars{position:absolute;right:18px;top:14px;font-size:22px;color:#D9A97A;letter-spacing:10px;opacity:.9}
label.field{display:grid;gap:6px;font-weight:600;font-size:15px}
label.field small{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],textarea,select{color:var(--ink);width:100%;border:1px solid var(--sand);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:#A99599}
.hero input[type=text]{border-color:transparent;font-size:18px}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:16px;background:var(--wine);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s ease,background .15s ease}
.btn:hover{background:var(--wine-deep)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--sand);color:#fff;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--wine)}
.btn.ghost:hover{background:var(--blush)}
.btn.light{background:#FFF7F3;color:var(--wine)}
.link{background:none;border:0;color:var(--wine);text-decoration:underline;padding:4px 0;font-size:14px}
.steps-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps-list li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.steps-list .n{width:38px;height:38px;border-radius:50%;background:var(--blush);color:var(--wine);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.note-box{border-left:3px solid var(--gold);padding:10px 14px;background:#FBF1E6;border-radius:0 12px 12px 0;font-size:15px}
/* months */
.month-strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:6px 0 4px}
.month-strip button{border:0;background:var(--line);height:30px;border-radius:8px;font-size:11px;color:var(--muted);padding:0}
.month-strip button.done{background:var(--blush);color:var(--wine);font-weight:600}
.month-strip button.cur{outline:2px solid var(--wine);outline-offset:1px}
.add-row{display:grid;gap:10px}
.add-row .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.good{background:var(--wine)}
.btn.bad{background:#8C7F7A}
.btn.bad:hover{background:#6F6460}
.items{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.items li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.good{background:var(--blush);color:var(--wine)}
.pill.bad{background:#E9E3E0;color:#5E5450}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--line)}
/* options */
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--sand);background:#fff;border-radius:14px;padding:14px 16px;font-size:16px;display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;transition:border-color .15s,background .15s}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--sand);margin-top:2px;display:grid;place-items:center}
.opt.check .dot{border-radius:6px}
.opt:hover{border-color:var(--wine)}
.opt.sel{border-color:var(--wine);background:#FCF1EE}
.opt.sel .dot{border-color:var(--wine);background:var(--wine)}
.opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.check.sel .dot::after{border-radius:2px}
/* notes */
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.scale button{border:1px solid var(--sand);background:#fff;border-radius:10px;height:46px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.scale button:hover{border-color:var(--wine)}
.scale button.sel{background:var(--wine);border-color:var(--wine);color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
@media (max-width:420px){.scale{grid-template-columns:repeat(6,1fr)}}
.band{font-family:var(--display);font-size:24px;color:var(--wine);margin:4px 0 0}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;border-radius:12px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--wine);border-radius:12px}
.bar .fill.low{background:#A58F94}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.bar{grid-template-columns:1fr 34px}.bar .track{grid-column:1/-1;grid-row:2}}
/* tema */
.areas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.area-card{border:1px solid var(--sand);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.area-card span{font-size:13px;color:var(--muted)}
.area-card.sel{border-color:var(--wine);background:var(--wine);color:#fff}
.area-card.sel span{color:#F3D3CB}
/* smart */
.smart{display:grid;gap:14px}
.smart-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.letter{width:40px;height:40px;border-radius:12px;background:var(--wine);color:#fff;font-family:var(--display);font-size:26px;display:grid;place-items:center}
.meta-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
/* pie */
.pie-wrap{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:20px;align-items:center}
.pie-wrap canvas{width:100%;height:auto;aspect-ratio:1}
@media (max-width:560px){.pie-wrap{grid-template-columns:1fr}.pie-wrap canvas{max-width:320px;margin:0 auto}}
.legend{display:flex;gap:16px;font-size:14px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--wine);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* result */
.result-section{display:grid;gap:12px;padding-top:6px}
.profile-card{background:var(--wine);color:#FBEFEA;border-radius:22px;padding:26px 22px}
.profile-card h2{color:#fff;margin-top:4px}
.profile-card p{color:#F6E2DC}
.profile-card .tag{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#E9B89F;font-weight:600}
.profile-card .tip{background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;margin-top:8px}
.profile-card .tip h3{color:#fff}
.word{font-family:var(--display);font-size:clamp(48px,11vw,80px);color:var(--wine);line-height:1;font-style:italic}
.meta-out{display:grid;gap:6px;font-size:15px}
.meta-out div{display:grid;grid-template-columns:22px 1fr;gap:8px}
.meta-out div b{font-family:var(--display);font-size:20px;color:var(--wine);line-height:1.1}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.story-img{width:100%;max-width:300px;border-radius:16px;border:1px solid var(--line);display:block}
.cta{background:var(--blush);border-radius:22px;padding:24px 22px}
.cta h2{margin-top:0}
.deco{position:relative}
.title-sparkle::after{content:" ✦";color:var(--gold);font-size:.9em}
.spark{color:var(--gold);font-size:.45em;vertical-align:.9em}
.divider{text-align:center;color:var(--gold);letter-spacing:12px;font-size:14px;margin:6px 0}
.stars-sm{color:#D9A97A;letter-spacing:8px;font-size:16px}
.mantra{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 22px;justify-items:center;margin-top:12px}
.mantra blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(30px,6.5vw,42px);line-height:1.15;color:var(--wine);text-wrap:balance;max-width:20ch}
.mantra cite{font-style:normal;color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.thanks{text-align:center;background:var(--wine);color:#F6E2DC;border-radius:22px;padding:30px 22px;display:grid;gap:10px;justify-items:center;margin-top:16px}
.thanks p{margin:0;max-width:44ch}
.thanks .lead{color:#fff}
.thanks .sig{font-family:var(--display);font-size:32px;color:#F3C9BD;font-style:italic}
.kicker::after{content:"";}
.hero::after{content:"✦";position:absolute;left:22px;bottom:14px;color:#D9A97A;opacity:.5;font-size:18px}
.status{font-size:14px;color:var(--wine);min-height:1.2em}
footer.sign{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
footer.sign b{color:var(--ink);font-weight:600}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.nav-inner{max-width:680px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px}
.nav-inner .btn{min-width:150px}
.screen{animation:in .35s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.stage i span{transition:none}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-inner">
      <div class="brand"><b>Meu 2027</b><span>Stefane Rodrigues · Psicóloga</span></div>
      <div class="stages" id="stages"></div>
    </div>
  </header>
  <main><div id="screen" class="screen"></div></main>
  <nav class="bottom" id="nav">
    <div class="nav-inner">
      <button class="btn ghost" id="backBtn" type="button">Voltar</button>
      <button class="btn" id="nextBtn" type="button">Continuar</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- Conteúdo ---------- */
const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MON3=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const AREAS=[
  {n:"Saúde física",d:"Seu corpo, seu sono, sua alimentação, seus exames, o quanto você se movimentou."},
  {n:"Saúde emocional",d:"Como você lidou com o que sentiu. Ansiedade, cansaço, autocuidado, momentos de paz."},
  {n:"Relacionamento afetivo",d:"Namoro, casamento ou a sua vida amorosa. Vale também se você está sem ninguém agora."},
  {n:"Família",d:"Pais, filhos, irmãos e também a família que você escolheu."},
  {n:"Amizades e lazer",d:"Encontros, risadas, descanso, hobbies. O tempo que foi só de prazer."},
  {n:"Trabalho e estudos",d:"Carreira, faculdade, cursos e o quanto o que você faz teve sentido pra você."},
  {n:"Finanças",d:"Dinheiro, contas, dívidas, reserva e como você se sentiu em relação a isso."},
  {n:"Espiritualidade e propósito",d:"Fé, sentido, conexão com algo maior e com os seus valores."}
];
const BANDS={
  low:{label:"Essa área pediu atenção em 2026.",q1:"O que pesou tanto nessa área?",q2:"O que seria um primeiro passo pra cuidar dela?",p1:"Por exemplo, a rotina não deixou espaço pra isso.",p2:"Por exemplo, marcar uma consulta ainda em janeiro."},
  mid:{label:"Tem coisa boa aqui, e espaço pra crescer.",q1:"O que funcionou nessa área?",q2:"O que falta pra essa nota subir?",p1:"Por exemplo, consegui manter alguns hábitos.",p2:"Por exemplo, mais constância e menos cobrança."},
  high:{label:"Que bom! Vale entender o que deu certo.",q1:"O que fez essa nota ser tão boa?",q2:"O que você quer manter em 2027?",p1:"Por exemplo, priorizei isso de verdade.",p2:"Por exemplo, continuar reservando esse tempo na agenda."}
};
const band=n=>n<=4?"low":(n<=7?"mid":"high");

const ORG=[
  {q:"Você planejou o seu 2026?",o:[
    ["Sim, com metas escritas e acompanhei ao longo do ano","e"],
    ["Pensei no que queria, mas não cheguei a escrever","s"],
    ["Planejei tudo em janeiro e esqueci lá por março","r"],
    ["Não planejei, fui vivendo","i"]]},
  {q:"Quando você faz planos, o que costuma acontecer?",o:[
    ["Cumpro boa parte do que planejei","e"],
    ["Faço planos lindos, mas travo na hora de começar","s"],
    ["Começo com tudo e perco o ritmo no meio do caminho","r"],
    ["Nem chego a planejar muito, vou resolvendo conforme aparece","i"]]},
  {q:"E quando alguma coisa sai do plano?",o:[
    ["Ajusto o que precisa e sigo","e"],
    ["Fico esperando o momento perfeito pra retomar","s"],
    ["Sinto que estraguei tudo e penso em recomeçar do zero","r"],
    ["Nem percebo muito, porque não tinha um plano fechado","i"]]},
  {q:"O que mais atrapalha você a chegar onde quer?",o:[
    ["Querer dar conta de tudo ao mesmo tempo","e"],
    ["Medo de não fazer direito, a autocobrança","s"],
    ["Falta de constância","r"],
    ["Não saber direito o que eu quero","i"]]}
];
const WHY=["Quero lembrar das minhas metas ao longo do ano","Quero alcançar um objetivo específico","Quero sair do piloto automático","Quero cuidar mais de mim","Faço isso todo ano e me faz bem","Quero que 2027 seja diferente de 2026"];

const PROFILES={
  e:{name:"Perfil Estrategista",short:"Você planeja e executa.",
    desc:"Você sabe o que quer e costuma chegar lá. Planejar faz parte de quem você é, e isso é uma força enorme. O risco desse perfil é querer abraçar o mundo. Tudo vira meta, tudo vira prioridade, e o descanso fica pra depois.",
    tip:"Em 2027, escolha menos. Uma área tema e poucas metas bem feitas valem mais do que uma lista enorme. Coloque pausa e lazer dentro do plano, como compromisso, e não como prêmio.",
    therapy:"A terapia ajuda a olhar pro que está por trás da necessidade de dar conta de tudo, e a descobrir quem você é quando não está produzindo."},
  s:{name:"Perfil Sonhador",short:"Você planeja muito, mas trava na hora de fazer.",
    desc:"Você tem ideias lindas e sabe exatamente como as coisas deveriam ser. O problema é que esse \"deveria\" costuma vir junto com muita cobrança. Como o plano precisa sair perfeito, começar dá medo, e aí você adia. Esse é o perfil mais comum entre os meus pacientes, e quase sempre tem perfeccionismo por trás.",
    tip:"Em 2027, troque o perfeito pelo possível. Divida cada meta em passos tão pequenos que dê pra fazer em 15 minutos. Feito é melhor que perfeito, e começar mal é melhor do que não começar.",
    therapy:"A terapia ajuda a entender de onde vem essa cobrança e a se tratar com mais gentileza, pra que errar deixe de ser uma ameaça."},
  i:{name:"Perfil Improviso",short:"Você vai no fluxo.",
    desc:"Você se adapta bem, resolve as coisas conforme aparecem e não se prende a planos. Isso traz leveza e criatividade. O outro lado é que, sem uma direção, o ano passa e fica a sensação de que a vida aconteceu com você, e não por escolha sua.",
    tip:"Em 2027, você não precisa de uma planilha. Precisa de uma bússola. Escolha a área tema, uma meta só e reserve um momento por mês pra olhar se está indo na direção que quer.",
    therapy:"A terapia ajuda a clarear o que você realmente quer, pra que seu jeito leve de viver tenha um rumo que faça sentido pra você."},
  r:{name:"Perfil Recomeço",short:"Você começa com tudo e perde o fôlego.",
    desc:"Janeiro é seu mês. Você começa com energia, compra o caderno, monta a rotina. Mas lá por março a vida aperta, uma semana sai do plano e parece que tudo foi perdido. Aí vem a culpa e a promessa de recomeçar na segunda. É o famoso tudo ou nada.",
    tip:"Em 2027, monte metas que cabem na sua rotina real, e não na rotina ideal. Tenha um plano B pras semanas difíceis. E lembre que falhar um dia não zera o ano. Você retoma de onde parou, sem precisar recomeçar do zero.",
    therapy:"A terapia ajuda a lidar com a culpa e a autocrítica que aparecem quando algo sai do plano, e a construir constância com mais gentileza."}
};


const PEXTRA={
  e:{frag:"Seu ponto de atenção é o excesso. Quando tudo é prioridade, nada é. E o cansaço costuma chegar antes do resultado.",quote:"O ótimo é inimigo do bom.",author:"Voltaire"},
  s:{frag:"Seu ponto de atenção é a autocobrança. O medo de não fazer direito faz você adiar, e adiar alimenta a sensação de que nunca é a hora certa de começar.",quote:"O que a vida quer da gente é coragem.",author:"Guimarães Rosa"},
  i:{frag:"Seu ponto de atenção é a falta de direção. Sem saber pra onde quer ir, fica difícil dizer não pro que te desvia do caminho.",quote:"Nenhum vento sopra a favor de quem não sabe para onde ir.",author:"Sêneca"},
  r:{frag:"Seu ponto de atenção é o tudo ou nada. Quando um dia sai do plano, a culpa faz parecer que o ano inteiro foi perdido.",quote:"Caia sete vezes, levante-se oito.",author:"Provérbio japonês"}
};
Object.keys(PEXTRA).forEach(k=>Object.assign(PROFILES[k],PEXTRA[k]));

/* ---------- Estado ---------- */
const KEY="meu2027-stefane-v1";
function blank(){return{step:0,name:"",months:MONTHS.map(()=>[]),org:[null,null,null,null],why:[],whyOther:"",areas:AREAS.map(()=>({note:null,a1:"",a2:""})),tema:null,frase:"",palavra:"",renuncia:"",metas:[{area:null,s:"",m:"",a:"",r:"",t:""}]};}

STEPS.push({id:"retroResult",st:0});

STEPS.push({id:"why",st:1},{id:"areasIntro",st:2});

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=()=>esc(S.name.trim()||"você");

function canNext(){
  const s=STEPS[S.step];
  switch(s.id){
    case "welcome":return S.name.trim().length>0;
    case "month":return S.months[s.i].length>0;
    case "org":return S.org[s.i]!==null;
    case "area":return S.areas[s.i].note!==null;
    case "tema":return S.tema!==null;
    case "metas":return S.metas[0].s.trim().length>0;
    default:return true;
  }
}

/* ---------- Cálculos ---------- */
function retroStats(){
  let g=0,b=0,best=null,worst=null;
  S.months.forEach((items,i)=>{
    const gg=items.filter(x=>x.good).length,bb=items.length-gg;g+=gg;b+=bb;
    const bal=gg-bb;
    if(items.length){
      if(best===null||bal>best.bal)best={i,bal};
      if(worst===null||bal<worst.bal)worst={i,bal};
    }
  });
  return{g,b,best,worst};
}
function retroMessage(st){
  const n=nm();
  if(st.g>st.b)return{t:"Seu 2026 teve mais coisas boas do que ruins.",p:[`Às vezes a gente termina o ano lembrando só do que pesou. Isso é natural. A nossa mente dá mais atenção ao que doeu, porque aprendeu a se proteger. Olhar mês a mês mostra o que a memória deixa passar.`,`Então, ${n}, para um instante e agradece por tudo isso. Pelas pessoas, pelos momentos e por você ter atravessado também o que foi difícil. Repara que muitas dessas coisas boas não aconteceram por acaso. Tiveram a sua escolha, o seu esforço e a sua coragem.`,`É com essa força que a gente vai planejar 2027.`]};
  if(st.b>st.g)return{t:"2026 pesou. E tudo bem reconhecer isso.",p:[`Nem todo ano é leve, e fingir que foi não ajuda ninguém. Olhar pro ano com honestidade já é um primeiro passo pra fazer diferente.`,`Repara que, mesmo num ano difícil, teve coisa boa aqui. Elas mostram o que te sustenta. Repara também nos meses que mais pesaram. Muitas vezes eles apontam o que precisa de cuidado, de limite ou de mudança.`,`Você chegou até aqui, ${n}, e isso já diz muito sobre você. Agora é a hora. Nas próximas etapas, a gente vai pensar no que você quer que mude.`]};
  return{t:"Seu 2026 ficou dividido ao meio.",p:[`Teve tanto coisa boa quanto coisa difícil. A vida costuma ser assim, misturada, e um ano não precisa ser perfeito pra ter valido a pena.`,`Agradece pelo que foi bom, ${n}. E olha com carinho pro que doeu, porque é ali que estão as pistas do que precisa mudar.`,`É com esse olhar que a gente vai planejar 2027.`]};
}
function profileKey(){
  const c={e:0,s:0,i:0,r:0};
  S.org.forEach((v,qi)=>{if(v!==null)c[ORG[qi].o[v][1]]++;});
  const max=Math.max(c.e,c.s,c.i,c.r);
  const tied=Object.keys(c).filter(k=>c[k]===max);
  if(tied.length===1)return tied[0];
  const q2=S.org[1]!==null?ORG[1].o[S.org[1]][1]:null;
  if(q2&&tied.includes(q2))return q2;
  for(const k of ["s","r","i","e"])if(tied.includes(k))return k;
  return "s";
}
function avgNote(){const ns=S.areas.map(a=>a.note).filter(n=>n!==null);return ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:0;}
const fmt1=n=>n.toFixed(1).replace(".",",");
function whyList(){const l=S.why.map(i=>WHY[i]);if(S.whyOther.trim())l.push(S.whyOther.trim());return l;}

/* ---------- Pizza ---------- */
function drawPie(cv,opt){
  const o=Object.assign({good:"#6E1F30",bad:"#B8ABA6",empty:"#EFE6DD",bg:"#FFFDF9",label:"#7A666A",center:"#6E1F30",sep:"#FFFDF9",labels:true,centerText:true},opt||{});
  const W=cv.width,ctx=cv.getContext("2d");
  ctx.clearRect(0,0,W,W);
  if(o.fill){ctx.fillStyle=o.fill;ctx.fillRect(0,0,W,W);}
  const cx=W/2,cy=W/2,R=W*(o.labels?0.38:0.47),step=Math.PI*2/12;
  S.months.forEach((items,i)=>{
    const a0=-Math.PI/2+i*step,a1=a0+step,t=items.length,g=items.filter(x=>x.good).length;
    if(!t){wedge(ctx,cx,cy,R,a0,a1,o.empty);return;}
    const ag=a0+step*(g/t);
    if(g)wedge(ctx,cx,cy,R,a0,ag,o.good);
    if(g<t)wedge(ctx,cx,cy,R,ag,a1,o.bad);
  });
  ctx.strokeStyle=o.sep;ctx.lineWidth=Math.max(2,W/160);
  for(let i=0;i<12;i++){const a=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.stroke();}
  ctx.fillStyle=o.bg;ctx.beginPath();ctx.arc(cx,cy,R*0.42,0,Math.PI*2);ctx.fill();
  if(o.centerText){
    ctx.fillStyle=o.center;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font=`italic ${Math.round(W*0.085)}px "Instrument Serif", Georgia, serif`;
    ctx.fillText("2026",cx,cy);
  }
  if(o.labels){
    ctx.fillStyle=o.label;ctx.font=`600 ${Math.round(W*0.036)}px Figtree, sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    for(let i=0;i<12;i++){const a=-Math.PI/2+(i+0.5)*step;ctx.fillText(MON3[i],cx+Math.cos(a)*R*1.18,cy+Math.sin(a)*R*1.18);}
  }
}
function wedge(ctx,cx,cy,r,a0,a1,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fill();}

  need(10);doc.setFont("times","italic");doc.setFontSize(18);doc.setTextColor(...WINE);y+=4;doc.text("Com carinho, Stefane",M,y);
  const n=doc.getNumberOfPages();

}

/* ---------- Imagem pros stories ---------- */
function wrapText(ctx,text,x,y,maxW,lh){const words=text.split(/\s+/);let line="";const out=[];words.forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});if(line)out.push(line);out.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return out.length*lh;}
function buildStory(){
  const cv=document.createElement("canvas");cv.width=1080;cv.height=1920;const c=cv.getContext("2d");
  const P=PROFILES[profileKey()];
  const g=c.createLinearGradient(0,0,0,1920);g.addColorStop(0,"#6E1F30");g.addColorStop(1,"#4A1420");c.fillStyle=g;c.fillRect(0,0,1080,1920);
  // brilhinhos
  const sp=[[120,200,46,.9],[950,270,34,.8],[60,900,24,.55],[1015,1010,26,.55],[960,1320,40,.75],[120,1440,30,.6],[540,250,20,.5],[840,1620,24,.55]];
  c.textAlign="center";c.textBaseline="middle";
  sp.forEach(([x,y,s,a],i)=>{c.globalAlpha=a;c.fillStyle="#D9A97A";c.font=`${s}px Figtree, sans-serif`;c.fillText(i%2?"✱":"✦",x,y);});
  c.globalAlpha=1;
  c.fillStyle="#F1C9BD";c.font="600 32px Figtree, sans-serif";c.fillText("M E U   2 0 2 7",540,420);
  c.fillStyle="#FFF7F3";c.font='400 132px "Instrument Serif", Georgia, serif';c.fillText("Meu 2027",540,580);
  c.font='italic 132px "Instrument Serif", Georgia, serif';c.fillStyle="#F3C9BD";c.fillText("vai ser incrível.",540,720);
  c.fillStyle="rgba(217,169,122,.6)";c.fillRect(470,860,140,2);
  c.fillStyle="#FFF7F3";c.font='italic 64px "Instrument Serif", Georgia, serif';
  const h=wrapText(c,`“${P.quote}”`,540,1000,820,80);
  c.fillStyle="#E9B89F";c.font="500 34px Figtree, sans-serif";c.fillText(P.author,540,1000+h+30);
  c.fillStyle="rgba(255,255,255,.75)";c.font="400 30px Figtree, sans-serif";c.fillText("Planejei o meu 2027 com a psi @sterodrigues.psi",540,1800);
  return cv;
}

}

const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
